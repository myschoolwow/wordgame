
name: Isparta 24 puzzle fotografini hazirla

on:
  workflow_dispatch:

jobs:
  fotograf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python indir_ve_hazirla.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Isparta-puzzle-fotograflari
          path: |
            assets/puzzles/
            FOTOGRAF_KAYNAKLARI.csv
            HATALAR.json
