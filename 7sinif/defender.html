<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WOW Word Defender Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#030b24;color:#fff;font-family:system-ui,Arial;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;pointer-events:none;text-shadow:0 2px 7px #000}.hud>div{background:#081839d9;border:1px solid #45b8ff88;border-radius:12px;padding:7px 10px;font-weight:750;font-size:clamp(12px,2.8vw,17px)}.prompt{position:fixed;top:66px;left:50%;transform:translateX(-50%);min-width:min(85vw,370px);text-align:center;background:#071c45e8;border:1px solid #9d65ff;border-radius:18px;padding:8px 15px;box-shadow:0 0 25px #6b38ff44;pointer-events:none}.prompt small{display:block;color:#9bc4f9;font-size:12px}.prompt strong{font-size:clamp(19px,5vw,28px)}.bottom{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);text-align:center;background:#061631bd;border:1px solid #2976b477;border-radius:14px;padding:8px 15px;font-size:13px;pointer-events:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#020b20bb;backdrop-filter:blur(5px)}.panel{background:#081b42;border:1px solid #6fdcff;border-radius:22px;padding:28px;max-width:420px;width:90%;text-align:center;box-shadow:0 0 50px #008cff66}.panel h1{margin:0 0 10px;font-size:28px}.panel p{line-height:1.5;color:#c7d9ff}.panel button{border:0;border-radius:13px;background:linear-gradient(110deg,#00d9f9,#8b56ff);color:#fff;font-size:18px;font-weight:800;padding:13px 26px;cursor:pointer}#msg{position:fixed;top:40%;width:100%;text-align:center;font-weight:900;font-size:30px;pointer-events:none;text-shadow:0 0 15px #000;opacity:0;transition:opacity .12s}</style></head><body><canvas id="game"></canvas><div class="hud"><div>⭐ <span id="score">0</span></div><div>🛡️ <span id="shield">100</span>%</div><div>🎯 <span id="hits">0</span>/10</div></div><div class="prompt"><small>DOĞRU ASTEROİDİ VUR</small><strong id="target">YÖRÜNGE</strong></div><div id="msg"></div><div class="bottom">Asteroide dokun → gemi otomatik ateşler</div><div class="overlay" id="overlay"><div class="panel"><h1>🚀 WORD DEFENDER</h1><p>Kelime taşıyan asteroidler aşağı doğru geliyor. Üstteki Türkçe anlamın İngilizce karşılığını taşıyan asteroide dokun ve gemin lazer ateşlesin!</p><button id="start">Oyuna Başla</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const demoDictionary=[['orbit','yörünge'],['storm','fırtına'],['lightning','şimşek'],['moon','Ay'],['sun','Güneş'],['planet','gezegen'],['bright','parlak'],['distance','mesafe'],['technology','teknoloji'],['future','gelecek'],['nature','doğa'],['energy','enerji'],['protect','korumak'],['recycle','geri dönüştürmek'],['pollution','kirlilik'],['country','ülke'],['capital','başkent'],['tradition','gelenek'],['pilot','pilot'],['engineer','mühendis']];let dictionary=demoDictionary.map(w=>[w[0],w[1]]);window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.wowDefender!==1||e.data.type!=='words')return;const words=e.data.words;if(Array.isArray(words)&&words.length>=3){dictionary=words.filter(w=>Array.isArray(w)&&typeof w[0]==='string'&&typeof w[1]==='string').map(w=>[w[0],w[1]]);if(!running){target=null;}}});if(window.parent!==window)window.parent.postMessage({wowDefender:1,type:'ready'},'*');let W=0,H=0,dpr=1,stars=[],rocks=[],shots=[],particles=[],score=0,shield=100,hits=0,target=null,running=false,last=0,spawnClock=0,nextId=0,feedbackTimer=0;const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(150,Math.floor(W*H/3800))},()=>({x:Math.random()*W,y:Math.random()*H,s:rnd(.5,2),v:rnd(10,35)}))}addEventListener('resize',resize);resize();function pickTarget(){const occupied=new Set(rocks.map(r=>r.word[0]));let pool=dictionary.filter(x=>!occupied.has(x[0]));target=pool[Math.floor(Math.random()*pool.length)]||dictionary[Math.floor(Math.random()*dictionary.length)];$('target').textContent=target[1].toLocaleUpperCase('tr-TR')}function spawnWave(){if(!target)pickTarget();const choices=[target];const others=dictionary.filter(x=>x[0]!==target[0]).sort(()=>Math.random()-.5).slice(0,2);choices.push(...others);choices.sort(()=>Math.random()-.5);const margin=45;const cols=choices.length;const usable=Math.max(150,W-2*margin);for(let i=0;i<cols;i++){let x=margin+(i+.5)*usable/cols;const rad=Math.min(48,Math.max(30,W/(cols*6)));rocks.push({id:++nextId,x,y:-rnd(70,160)-i*17,r:rad,word:choices[i],speed:rnd(72,98)+hits*3.3,angle:rnd(0,6.28),spin:rnd(-.6,.6),hit:false})}}function burst(x,y,color,count=16){for(let i=0;i<count;i++){const a=rnd(0,Math.PI*2),v=rnd(35,180);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rnd(.3,.7),max:.7,color})}}function message(t,color){$('msg').textContent=t;$('msg').style.color=color;$('msg').style.opacity=1;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('msg').style.opacity=0,650)}function fire(x,y){if(!running)return;let candidate=null,dist=Infinity;for(const r of rocks){const d=Math.hypot(x-r.x,y-r.y);if(d<r.r+19&&d<dist){candidate=r;dist=d}}if(!candidate)return;const r=candidate;rocks=rocks.filter(a=>a!==r);shots.push({x:W/2,y:H-75,tx:r.x,ty:r.y,t:0});if(r.word[0]===target[0]){score+=10;hits++;if(window.parent!==window)window.parent.postMessage({wowDefender:1,type:'result',correct:true,word:r.word},'*');burst(r.x,r.y,'#45eaff',24);message('DOĞRU! +10','#83ffdb');$('score').textContent=score;$('hits').textContent=hits;rocks=[];spawnClock=.5;pickTarget();if(hits>=10){finish(true)}}else{shield=Math.max(0,shield-15);if(window.parent!==window)window.parent.postMessage({wowDefender:1,type:'result',correct:false,word:r.word},'*');burst(r.x,r.y,'#ff7d80',15);message('YANLIŞ HEDEF!','#ff9ca9');$('shield').textContent=shield;if(shield<=0)finish(false)}}canvas.addEventListener('pointerdown',e=>{const b=canvas.getBoundingClientRect();fire(e.clientX-b.left,e.clientY-b.top)});function finish(win){running=false;$('overlay').style.display='grid';$('overlay').querySelector('h1').textContent=win?'🏆 Görev Tamamlandı!':'🛡️ Kalkan Tükendi';$('overlay').querySelector('p').textContent=`Skor: ${score} • Doğru vuruş: ${hits}. WOW6 oyun oturumu.`;$('start').textContent='Yeniden Oyna'}function start(){score=0;shield=100;hits=0;rocks=[];shots=[];particles=[];target=null;spawnClock=0;last=0;running=true;$('score').textContent=0;$('shield').textContent=100;$('hits').textContent=0;$('overlay').style.display='none';pickTarget();spawnWave()}$('start').onclick=start;function drawShip(){const x=W/2,y=H-74;ctx.save();ctx.translate(x,y);ctx.shadowColor='#00dfff';ctx.shadowBlur=20;ctx.fillStyle='#21d4ff';ctx.beginPath();ctx.moveTo(0,-37);ctx.lineTo(25,22);ctx.lineTo(0,13);ctx.lineTo(-25,22);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#143b85';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(10,14);ctx.lineTo(-10,14);ctx.fill();ctx.fillStyle='#ffb85c';ctx.beginPath();ctx.moveTo(-8,21);ctx.lineTo(0,35+rnd(0,9));ctx.lineTo(8,21);ctx.fill();ctx.restore()}function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.shadowColor='#7d7af9';ctx.shadowBlur=14;ctx.fillStyle='#665c8d';ctx.strokeStyle='#b8a9f4';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rad=r.r*(i%3===0?.86:1);const px=Math.cos(a)*rad,py=Math.sin(a)*rad;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#39395f';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(Math.cos(i*2.2)*r.r*.45,Math.sin(i*2.2)*r.r*.4,r.r*.12,0,7);ctx.fill()}ctx.restore();ctx.font=`800 ${Math.max(12,Math.min(19,r.r*.44))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#10142b';ctx.strokeText(r.word[0],r.x,r.y);ctx.fillStyle='white';ctx.fillText(r.word[0],r.x,r.y)}function frame(t){const dt=Math.min(.045,(t-last)/1000||0);last=t;ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050a2a');g.addColorStop(.6,'#11114c');g.addColorStop(1,'#050f2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){s.y+=s.v*dt*(running?1:.2);if(s.y>H)s.y=0;ctx.fillStyle='#a8d8ff';ctx.globalAlpha=.4+s.s/4;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;ctx.beginPath();ctx.ellipse(W/2,H+Math.max(80,W*.1),Math.max(W*.65,300),Math.max(100,W*.18),0,0,Math.PI*2);ctx.fillStyle='#0b377d';ctx.fill();ctx.strokeStyle='#1be0ff';ctx.lineWidth=5;ctx.shadowBlur=22;ctx.shadowColor='#06ccff';ctx.stroke();ctx.shadowBlur=0;if(running){spawnClock-=dt;if(spawnClock<=0&&rocks.length===0){spawnWave();spawnClock=5}for(const r of rocks){r.y+=r.speed*dt;r.angle+=r.spin*dt;if(r.y>H-115){shield=Math.max(0,shield-20);if(r.word[0]===target[0]&&window.parent!==window)window.parent.postMessage({wowDefender:1,type:'result',correct:false,word:r.word},'*');$('shield').textContent=shield;burst(r.x,H-130,'#ff755c',15);rocks=rocks.filter(a=>a!==r);if(r.word[0]===target[0]){rocks=[];pickTarget()}if(shield<=0)finish(false)}}}for(const r of rocks)drawRock(r);for(const sh of shots){sh.t+=dt*5;ctx.strokeStyle='#00f3ff';ctx.lineWidth=5;ctx.shadowColor='#00ffff';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x+(sh.tx-sh.x)*Math.min(sh.t,1),sh.y+(sh.ty-sh.y)*Math.min(sh.t,1));ctx.stroke();ctx.shadowBlur=0}shots=shots.filter(s=>s.t<1);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;ctx.globalAlpha=Math.max(0,p.t/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;particles=particles.filter(p=>p.t>0);drawShip();requestAnimationFrame(frame)}requestAnimationFrame(frame);/* Wait for explicit player start; do not launch behind overlay. */})();
</script></body></html>
